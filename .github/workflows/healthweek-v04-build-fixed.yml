name: Build Health Week v0.4 fixed

on: [pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Reconstruct and patch source
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$RUNNER_TEMP/healthweek-v04"
          ARCHIVE="$RUNNER_TEMP/healthweek-v04-src.tar.xz"
          rm -rf "$PROJECT"
          mkdir -p "$PROJECT"
          cat ci/healthweek-v04/source.xz.b64.* | tr -d '\r\n\t ' | base64 --decode > "$ARCHIVE"
          echo '54a8c080e9e361f9cf3e09933244477423f89179c74ec5ba2b83dfa1b824a4ab  '"$ARCHIVE" | sha256sum --check --strict -
          tar -tJf "$ARCHIVE" >/dev/null
          tar -xJf "$ARCHIVE" -C "$PROJECT"
          chmod +x "$PROJECT/gradlew" "$PROJECT/desktop-pwa/run.sh"

          cat > "$PROJECT/even-g2/app.json" <<'JSON'
          {
            "package_id": "com.photonspark.healthweekg2",
            "edition": "202601",
            "name": "Health Week",
            "version": "0.4.0",
            "min_app_version": "2.0.0",
            "min_sdk_version": "0.0.12",
            "entrypoint": "index.html",
            "permissions": [
              {
                "name": "network",
                "desc": "Connect to the user-configured Health Week phone server to load private health summaries."
              }
            ],
            "supported_languages": ["en"]
          }
          JSON

          python3 - "$PROJECT" <<'PY'
          from pathlib import Path
          import sys

          project = Path(sys.argv[1])

          api = project / "app/src/main/java/com/photonspark/galaxyhealthweek/server/HealthApiService.kt"
          source = api.read_text()
          old = "days = selected.map(DailyHealth::toSummaryDto),"
          new = "days = selected.map { it.toSummaryDto() },"
          if old not in source:
              raise SystemExit("HealthApiService member-extension patch target not found")
          api.write_text(source.replace(old, new))

          server = project / "app/src/main/java/com/photonspark/galaxyhealthweek/server/HealthDashboardServer.kt"
          source = server.read_text()
          start_marker = '        val assetPath = "web/$normalized"\n'
          end_marker = '        return HttpResponse(\n'
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit(f"HealthDashboardServer asset block markers not found: start={start}, end={end}")
          replacement = '''        val assetPath = "web/$normalized"
          val requestedBytes = runCatching { appContext.assets.open(assetPath).use { it.readBytes() } }
              .getOrNull()
          val fallbackBytes = if (requestedBytes == null && !normalized.contains('.')) {
              runCatching { appContext.assets.open("web/index.html").use { it.readBytes() } }.getOrNull()
          } else {
              null
          }
          val bytes: ByteArray = requestedBytes
              ?: fallbackBytes
              ?: return HttpResponse.json(404, ErrorResponse("Page not found."), gson)

          '''
          server.write_text(source[:start] + replacement + source[end:])
          PY

      - name: Restore Samsung Health SDK
        working-directory: ${{ runner.temp }}/healthweek-v04
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl --fail --location --retry 4 --retry-all-errors \
            -o app/libs/samsung-health-data-api-1.1.0.aar \
            https://raw.githubusercontent.com/S108-Sleeper/Sleeper_APP/b15fa77b9f296bb1c9e50ee54f786d11b67fdd0b/App/core/samsung-health/libs/samsung-health-data-api-1.1.0.aar
          echo 'f5d3d83cf00b97d0bb1b1db4da076e861eb1c3e6e704d89a34e68909d2f38654  app/libs/samsung-health-data-api-1.1.0.aar' | sha256sum --check --strict -

      - name: Validate web frontend
        working-directory: ${{ runner.temp }}/healthweek-v04
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/web/assets/app.js
          node --check desktop-pwa/assets/app.js
          diff -u app/src/main/assets/web/index.html desktop-pwa/index.html
          diff -u app/src/main/assets/web/assets/app.js desktop-pwa/assets/app.js
          diff -u app/src/main/assets/web/assets/styles.css desktop-pwa/assets/styles.css

      - name: Build Even Realities G2 package
        working-directory: ${{ runner.temp }}/healthweek-v04/even-g2
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build
          npx evenhub pack app.json dist -o HealthWeek-G2-v0.4.0.ehpk
          test -s HealthWeek-G2-v0.4.0.ehpk

      - name: Test and build phone and watch
        working-directory: ${{ runner.temp }}/healthweek-v04
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest :app:assembleRelease :wear:assembleRelease --stacktrace --no-daemon

      - name: Lint diagnostics
        continue-on-error: true
        working-directory: ${{ runner.temp }}/healthweek-v04
        run: ./gradlew :app:lintRelease :wear:lintRelease --stacktrace --no-daemon

      - name: Package outputs
        working-directory: ${{ runner.temp }}/healthweek-v04
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          OUT="$RUNNER_TEMP/healthweek-v04-artifact"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          PHONE="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)"
          WATCH="$(find wear/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -f "$PHONE"
          test -f "$WATCH"

          "$BT/zipalign" -p -f 4 "$PHONE" "$OUT/HealthWeek-v0.4.0-unsigned.apk"
          "$BT/zipalign" -p -f 4 "$WATCH" "$OUT/HealthWeek-Wear-v0.4.0-unsigned.apk"
          "$BT/zipalign" -c -v 4 "$OUT/HealthWeek-v0.4.0-unsigned.apk" > "$OUT/phone-zipalign.txt"
          "$BT/zipalign" -c -v 4 "$OUT/HealthWeek-Wear-v0.4.0-unsigned.apk" > "$OUT/watch-zipalign.txt"
          "$BT/aapt" dump badging "$OUT/HealthWeek-v0.4.0-unsigned.apk" > "$OUT/phone-aapt-badging.txt"
          "$BT/aapt" dump badging "$OUT/HealthWeek-Wear-v0.4.0-unsigned.apk" > "$OUT/watch-aapt-badging.txt"
          unzip -t "$OUT/HealthWeek-v0.4.0-unsigned.apk" > "$OUT/phone-zip-integrity.txt"
          unzip -t "$OUT/HealthWeek-Wear-v0.4.0-unsigned.apk" > "$OUT/watch-zip-integrity.txt"
          sha256sum "$OUT/HealthWeek-v0.4.0-unsigned.apk" > "$OUT/HealthWeek-v0.4.0-unsigned.apk.sha256"
          sha256sum "$OUT/HealthWeek-Wear-v0.4.0-unsigned.apk" > "$OUT/HealthWeek-Wear-v0.4.0-unsigned.apk.sha256"

          cp "$BT/zipalign" "$OUT/zipalign"
          cp "$BT/lib/apksigner.jar" "$OUT/apksigner.jar"
          cp even-g2/HealthWeek-G2-v0.4.0.ehpk "$OUT/"
          sha256sum "$OUT/HealthWeek-G2-v0.4.0.ehpk" > "$OUT/HealthWeek-G2-v0.4.0.ehpk.sha256"

          (cd desktop-pwa && zip -qr "$OUT/HealthWeek-Desktop-PWA-v0.4.0.zip" .)
          sha256sum "$OUT/HealthWeek-Desktop-PWA-v0.4.0.zip" > "$OUT/HealthWeek-Desktop-PWA-v0.4.0.zip.sha256"

          zip -qr "$OUT/HealthWeek-v0.4.0-source.zip" . \
            -x 'app/libs/*.aar' 'app/build/*' 'wear/build/*' '.gradle/*' \
               'even-g2/node_modules/*' 'even-g2/dist/*' 'even-g2/*.ehpk' \
               'signing.properties' '*.p12' '*.jks' '*.keystore'
          sha256sum "$OUT/HealthWeek-v0.4.0-source.zip" > "$OUT/HealthWeek-v0.4.0-source.zip.sha256"

          cp -r app/build/reports/tests/testDebugUnitTest "$OUT/phone-unit-tests" || true
          cp app/build/reports/lint-results-release.html "$OUT/phone-lint-release.html" || true
          cp wear/build/reports/lint-results-release.html "$OUT/watch-lint-release.html" || true

      - uses: actions/upload-artifact@v4
        with:
          name: HealthWeek-v0.4.0-multitarget-build-fixed
          path: ${{ runner.temp }}/healthweek-v04-artifact/*
          if-no-files-found: error
          retention-days: 1
