name: Build Health Week v0.5 final 2

on:
  pull_request:
    branches: [main]
    paths:
      - 'ci/healthweek-v05-final/**'
      - '.github/workflows/healthweek-v05-final2.yml'

permissions:
  contents: read

concurrency:
  group: healthweek-v05-final2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Reconstruct source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          BASE_COMMIT='78a52b468c295550a2f97f0ef3f0788907280c02'
          BASE_SHA='54a8c080e9e361f9cf3e09933244477423f89179c74ec5ba2b83dfa1b824a4ab'
          OVERLAY_SHA='a8cc35f2c86acb03f95b2988a9dc42757a677ca22ddbec6b6554bb2ef298affc'
          PROJECT="$RUNNER_TEMP/healthweek-v05"
          PARTS="$RUNNER_TEMP/v04-parts"
          BASE="$RUNNER_TEMP/base.tar.xz"
          OVERLAY="$RUNNER_TEMP/overlay.tar.xz"
          rm -rf "$PROJECT" "$PARTS" && mkdir -p "$PROJECT" "$PARTS"
          for n in $(seq 0 99); do
            p=$(printf '%03d' "$n")
            u="https://raw.githubusercontent.com/CesarPetrescu/emptyrepo/${BASE_COMMIT}/ci/healthweek-v04/source.xz.b64.${p}"
            curl --fail --silent --show-error --location "$u" -o "$PARTS/$p" || { rm -f "$PARTS/$p"; break; }
          done
          test "$(find "$PARTS" -type f | wc -l)" -gt 0
          cat "$PARTS"/* | tr -d '\r\n\t ' | base64 --decode > "$BASE"
          echo "$BASE_SHA  $BASE" | sha256sum -c -
          tar -xJf "$BASE" -C "$PROJECT"
          cat ci/healthweek-v05-final/overlay.xz.b64.* | tr -d '\r\n\t ' | base64 --decode > "$OVERLAY"
          echo "$OVERLAY_SHA  $OVERLAY" | sha256sum -c -
          tar -xJf "$OVERLAY" -C "$PROJECT"

          # Kotlin treats the literal slash-star sequence inside KDoc as a nested comment.
          sed -i 's#/api/v1/glasses/\\\* routes#/api/v1/glasses/ routes#' "$PROJECT/app/src/main/java/com/photonspark/galaxyhealthweek/server/GlassesBridgeStore.kt"

          # SDK 0.0.15 does not publicly export the background helpers described by Even docs.
          # Keep the documented host snapshot contract as a compatible fallback.
          python3 - "$PROJECT" <<'PY'
          from pathlib import Path
          import json, sys
          root=Path(sys.argv[1])
          main=root/'even-g2/src/main.ts'
          s=main.read_text()
          s=s.replace("import {\n  onBackgroundRestore,\n  setBackgroundState,\n  waitForEvenAppBridge,\n  type EvenAppBridge,\n  type EvenHubEvent,\n} from '@evenrealities/even_hub_sdk'", "import {\n  waitForEvenAppBridge,\n  type EvenAppBridge,\n  type EvenHubEvent,\n} from '@evenrealities/even_hub_sdk'\nimport * as EvenSdk from '@evenrealities/even_hub_sdk'")
          start=s.find('// Even Hub migrates the plugin between foreground and headless WebViews.')
          end=s.find("document.querySelector('#pair')", start)
          if start < 0 or end < 0: raise SystemExit('G2 persistence block not found')
          block=r'''// Background state persistence for Even Hub headless WebView migration.
          type BackgroundApi = {
            setBackgroundState?: (key: string, exporter: () => Record<string, unknown>) => void
            onBackgroundRestore?: (key: string, restorer: (saved: Record<string, unknown>) => void) => void
          }
          type HostStateWindow = Window & { __getStateSnapshot?: () => string; __restoreState?: (snapshot: string) => void }
          const exportRuntimeState = (): PersistedState => ({ pageIndex, data, etag, lastFetchAt, token: settings.token, clientId: settings.clientId })
          function restoreRuntimeState(saved: Partial<PersistedState>) {
            pageIndex = normalizePage(saved.pageIndex ?? pageIndex)
            data = saved.data ?? data
            etag = saved.etag ?? etag
            lastFetchAt = saved.lastFetchAt ?? lastFetchAt
            settings = { ...settings, token: saved.token ?? settings.token, clientId: saved.clientId ?? settings.clientId }
            persistAll(); renderPhonePreview(); void renderGlasses()
          }
          function registerBackgroundPersistence() {
            const api = EvenSdk as unknown as BackgroundApi
            if (api.setBackgroundState && api.onBackgroundRestore) {
              api.setBackgroundState(BACKGROUND_KEY, () => ({ ...exportRuntimeState() }))
              api.onBackgroundRestore(BACKGROUND_KEY, saved => restoreRuntimeState(saved as Partial<PersistedState>))
              return
            }
            const host = window as HostStateWindow
            const oldGet = host.__getStateSnapshot?.bind(host)
            const oldRestore = host.__restoreState?.bind(host)
            host.__getStateSnapshot = () => {
              let root: Record<string, unknown> = {}
              if (oldGet) { try { root = { ...(JSON.parse(oldGet()) as Record<string, unknown>) } } catch {} }
              root[BACKGROUND_KEY] = exportRuntimeState()
              return JSON.stringify(root)
            }
            host.__restoreState = snapshot => {
              oldRestore?.(snapshot)
              try { const root=JSON.parse(snapshot) as Record<string, unknown>; const saved=root[BACKGROUND_KEY]; if (saved && typeof saved === 'object') restoreRuntimeState(saved as Partial<PersistedState>) } catch {}
            }
          }
          registerBackgroundPersistence()

          '''
          main.write_text(s[:start]+block+s[end:])
          manifest=root/'even-g2/app.json'
          m=json.loads(manifest.read_text()); m['min_app_version']='2.2.10'; m['min_sdk_version']='0.0.15'; manifest.write_text(json.dumps(m,indent=2)+'\n')
          PY
          chmod +x "$PROJECT/gradlew"
          rm -f "$PROJECT/even-g2/package-lock.json"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
      - name: Restore Samsung Health AAR
        env:
          PROJECT: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          mkdir -p "$PROJECT/app/libs"
          curl --fail --location --retry 4 --retry-all-errors -o "$PROJECT/app/libs/samsung-health-data-api-1.1.0.aar" https://raw.githubusercontent.com/S108-Sleeper/Sleeper_APP/b15fa77b9f296bb1c9e50ee54f786d11b67fdd0b/App/core/samsung-health/libs/samsung-health-data-api-1.1.0.aar
          echo 'f5d3d83cf00b97d0bb1b1db4da076e861eb1c3e6e704d89a34e68909d2f38654  '"$PROJECT/app/libs/samsung-health-data-api-1.1.0.aar" | sha256sum -c -
      - name: Build G2
        env:
          PROJECT: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          cd "$PROJECT/even-g2"
          npm install --no-audit --no-fund
          npm run build
          npx evenhub pack app.json dist --sdk-ver 0.0.15 -o HealthWeek-G2-v0.5.0.ehpk
      - name: Test lint and build Android
        env:
          PROJECT: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          cd "$PROJECT"
          ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :wear:lintRelease :wear:assembleRelease --stacktrace --no-daemon
      - name: Package
        id: pkg
        env:
          PROJECT: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/out"; rm -rf "$OUT"; mkdir -p "$OUT/install" "$OUT/desktop" "$OUT/source" "$OUT/docs" "$OUT/validation"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          P=$(find "$PROJECT/app/build/outputs/apk/release" -type f -name '*.apk' | head -1)
          W=$(find "$PROJECT/wear/build/outputs/apk/release" -type f -name '*.apk' | head -1)
          "$BT/zipalign" -p -f 4 "$P" "$OUT/install/HealthWeek-v0.5.0-unsigned.apk"
          "$BT/zipalign" -p -f 4 "$W" "$OUT/install/HealthWeek-Wear-v0.5.0-unsigned.apk"
          "$BT/zipalign" -c -v 4 "$OUT/install/HealthWeek-v0.5.0-unsigned.apk" > "$OUT/validation/phone-zipalign.txt"
          "$BT/zipalign" -c -v 4 "$OUT/install/HealthWeek-Wear-v0.5.0-unsigned.apk" > "$OUT/validation/watch-zipalign.txt"
          "$BT/aapt" dump badging "$OUT/install/HealthWeek-v0.5.0-unsigned.apk" > "$OUT/validation/phone-badging.txt"
          "$BT/aapt" dump badging "$OUT/install/HealthWeek-Wear-v0.5.0-unsigned.apk" > "$OUT/validation/watch-badging.txt"
          unzip -t "$OUT/install/HealthWeek-v0.5.0-unsigned.apk" > "$OUT/validation/phone-integrity.txt"
          unzip -t "$OUT/install/HealthWeek-Wear-v0.5.0-unsigned.apk" > "$OUT/validation/watch-integrity.txt"
          cp "$PROJECT/even-g2/HealthWeek-G2-v0.5.0.ehpk" "$OUT/install/"
          (cd "$PROJECT/desktop-pwa" && zip -qr "$OUT/desktop/HealthWeek-Desktop-PWA-v0.5.0.zip" .)
          cp "$PROJECT/README.md" "$OUT/docs/"; cp -r "$PROJECT/docs/." "$OUT/docs/"
          cp "$BT/zipalign" "$OUT/validation/zipalign"; cp "$BT/lib/apksigner.jar" "$OUT/validation/apksigner.jar"
          cp "$PROJECT/app/build/reports/lint-results-release.html" "$OUT/validation/phone-lint.html" || true
          cp "$PROJECT/wear/build/reports/lint-results-release.html" "$OUT/validation/watch-lint.html" || true
          cp -r "$PROJECT/app/build/reports/tests/testDebugUnitTest" "$OUT/validation/unit-tests" || true
          rm -f "$PROJECT/app/libs/samsung-health-data-api-1.1.0.aar" "$PROJECT/signing.properties"
          rm -rf "$PROJECT/app/build" "$PROJECT/wear/build" "$PROJECT/.gradle" "$PROJECT/.kotlin" "$PROJECT/even-g2/node_modules" "$PROJECT/even-g2/dist"
          rm -f "$PROJECT/even-g2/HealthWeek-G2-v0.5.0.ehpk"
          (cd "$PROJECT" && zip -qr "$OUT/source/HealthWeek-v0.5.0-source.zip" . -x '*.jks' '*.keystore' '*.p12')
          find "$OUT" -type f -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS.txt"
          (cd "$OUT" && zip -qr "$RUNNER_TEMP/HealthWeek-v0.5.0-unsigned-all-in-one.zip" .)
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: HealthWeek-v0.5.0-unsigned-all-in-one-final2
          path: |
            ${{ steps.pkg.outputs.out }}/**
            ${{ runner.temp }}/HealthWeek-v0.5.0-unsigned-all-in-one.zip
          if-no-files-found: error
          retention-days: 7
