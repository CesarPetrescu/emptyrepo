name: Temporary Health Week v0.3 build

on:
  push:
    branches:
      - main
    paths:
      - 'ci/healthweek-v03/READY'
      - '.github/workflows/healthweek-v03-temp-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Reconstruct and patch source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/healthweek"
          cat ci/healthweek-v03/source.xz.b64.* \
            | tr -d '\r\n\t ' \
            | base64 --decode \
            > "$RUNNER_TEMP/healthweek-source.tar.xz"
          printf '%s  %s\n' \
            '6c90d5ecdbead3ba95936f7a399618e572d331e5dbcb0a9c5e7c5ba47fb863f2' \
            "$RUNNER_TEMP/healthweek-source.tar.xz" \
            | sha256sum --check --strict -
          tar -tJf "$RUNNER_TEMP/healthweek-source.tar.xz" >/dev/null
          tar -xJf "$RUNNER_TEMP/healthweek-source.tar.xz" \
            -C "$RUNNER_TEMP/healthweek"
          chmod +x "$RUNNER_TEMP/healthweek/gradlew"

          # With this Compose/Kotlin combination weight is a RowScope/ColumnScope
          # member extension. Explicitly importing the internal backing property
          # is rejected by K2, while calls inside Row/Column remain valid.
          sed -i '/^import androidx\.compose\.foundation\.layout\.weight$/d' \
            "$RUNNER_TEMP/healthweek/app/src/main/java/com/photonspark/galaxyhealthweek/ui/DashboardScreens.kt" \
            "$RUNNER_TEMP/healthweek/app/src/main/java/com/photonspark/galaxyhealthweek/ui/GalaxyHealthWeekApp.kt" \
            "$RUNNER_TEMP/healthweek/app/src/main/java/com/photonspark/galaxyhealthweek/ui/SyncScreen.kt"

      - name: Restore pinned Samsung Health Data SDK AAR
        working-directory: ${{ runner.temp }}/healthweek
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl --fail --location --retry 4 --retry-all-errors \
            --output app/libs/samsung-health-data-api-1.1.0.aar \
            https://raw.githubusercontent.com/S108-Sleeper/Sleeper_APP/b15fa77b9f296bb1c9e50ee54f786d11b67fdd0b/App/core/samsung-health/libs/samsung-health-data-api-1.1.0.aar
          printf '%s  %s\n' \
            'f5d3d83cf00b97d0bb1b1db4da076e861eb1c3e6e704d89a34e68909d2f38654' \
            'app/libs/samsung-health-data-api-1.1.0.aar' \
            | sha256sum --check --strict -

      - name: Unit tests and release APK
        working-directory: ${{ runner.temp }}/healthweek
        shell: bash
        run: |
          ./gradlew \
            :app:testDebugUnitTest \
            :app:assembleRelease \
            --stacktrace \
            --no-daemon

      - name: Android lint diagnostic
        continue-on-error: true
        working-directory: ${{ runner.temp }}/healthweek
        shell: bash
        run: |
          ./gradlew :app:lintRelease --stacktrace --no-daemon

      - name: Verify and package unsigned APK
        if: ${{ always() && hashFiles(format('{0}/healthweek/app/build/outputs/apk/release/*.apk', runner.temp)) != '' }}
        working-directory: ${{ runner.temp }}/healthweek
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f \
            \( -name '*-unsigned.apk' -o -name 'app-release.apk' \) \
            | head -1)"
          test -n "$APK"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p artifact
          "$BUILD_TOOLS/zipalign" -p -f 4 \
            "$APK" \
            artifact/HealthWeek-v0.3.0-unsigned.apk
          "$BUILD_TOOLS/zipalign" -c -v 4 \
            artifact/HealthWeek-v0.3.0-unsigned.apk \
            | tee artifact/zipalign-unsigned.txt
          "$BUILD_TOOLS/aapt" dump badging \
            artifact/HealthWeek-v0.3.0-unsigned.apk \
            | tee artifact/aapt-badging.txt
          unzip -t artifact/HealthWeek-v0.3.0-unsigned.apk \
            | tee artifact/zip-integrity-unsigned.txt
          sha256sum artifact/HealthWeek-v0.3.0-unsigned.apk \
            | tee artifact/HealthWeek-v0.3.0-unsigned.apk.sha256

          cp "$BUILD_TOOLS/zipalign" artifact/zipalign
          cp "$BUILD_TOOLS/lib/apksigner.jar" artifact/apksigner.jar
          cp app/build/reports/lint-results-release.html artifact/ || true
          cp app/build/reports/lint-results-release.xml artifact/ || true
          cp -r app/build/reports/tests/testDebugUnitTest artifact/unit-tests || true
          (
            cd "$RUNNER_TEMP/healthweek"
            zip -qr artifact/HealthWeek-v0.3.0-source.zip . \
              -x 'app/libs/*.aar' \
              -x 'app/build/*' \
              -x '.gradle/*' \
              -x 'artifact/*'
          )

      - name: Upload build package
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: HealthWeek-v0.3.0-unsigned-build
          path: ${{ runner.temp }}/healthweek/artifact/*
          if-no-files-found: warn
          retention-days: 1
