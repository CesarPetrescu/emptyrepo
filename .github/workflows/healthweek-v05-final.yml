name: Build Health Week v0.5 final

on:
  pull_request:
    branches: [main]
    paths:
      - 'ci/healthweek-v05-final/**'
      - '.github/workflows/healthweek-v05-final.yml'

permissions:
  contents: write

concurrency:
  group: healthweek-v05-final
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Reconstruct v0.4 base source and apply v0.5 overlay
        id: source
        shell: bash
        run: |
          set -euo pipefail
          BASE_COMMIT='78a52b468c295550a2f97f0ef3f0788907280c02'
          BASE_SHA='54a8c080e9e361f9cf3e09933244477423f89179c74ec5ba2b83dfa1b824a4ab'
          OVERLAY_SHA='a8cc35f2c86acb03f95b2988a9dc42757a677ca22ddbec6b6554bb2ef298affc'
          PROJECT="$RUNNER_TEMP/healthweek-v05"
          PARTS="$RUNNER_TEMP/v04-parts"
          BASE_ARCHIVE="$RUNNER_TEMP/healthweek-v04-source.tar.xz"
          OVERLAY="$RUNNER_TEMP/healthweek-v05-overlay.tar.xz"
          rm -rf "$PROJECT" "$PARTS"
          mkdir -p "$PROJECT" "$PARTS"

          count=0
          for n in $(seq 0 99); do
            part=$(printf '%03d' "$n")
            url="https://raw.githubusercontent.com/CesarPetrescu/emptyrepo/${BASE_COMMIT}/ci/healthweek-v04/source.xz.b64.${part}"
            if curl --fail --silent --show-error --location --retry 3 "$url" -o "$PARTS/$part"; then
              count=$((count + 1))
            else
              rm -f "$PARTS/$part"
              break
            fi
          done
          test "$count" -gt 0
          cat "$PARTS"/* | tr -d '\r\n\t ' | base64 --decode > "$BASE_ARCHIVE"
          echo "$BASE_SHA  $BASE_ARCHIVE" | sha256sum --check --strict -
          tar -tJf "$BASE_ARCHIVE" >/dev/null
          tar -xJf "$BASE_ARCHIVE" -C "$PROJECT"

          cat ci/healthweek-v05-final/overlay.xz.b64.* \
            | tr -d '\r\n\t ' \
            | base64 --decode \
            > "$OVERLAY"
          echo "$OVERLAY_SHA  $OVERLAY" | sha256sum --check --strict -
          tar -tJf "$OVERLAY" >/dev/null
          tar -xJf "$OVERLAY" -C "$PROJECT"

          # Even's background-state docs describe setBackgroundState/onBackgroundRestore,
          # but npm SDK 0.0.15 does not export them yet. Use those functions when a future
          # SDK exposes them and fall back to the host's documented snapshot hooks today.
          python3 - "$PROJECT" <<'PY'
          from pathlib import Path
          import json
          import sys

          root = Path(sys.argv[1])
          main = root / 'even-g2/src/main.ts'
          s = main.read_text()
          s = s.replace(
              "import {\n  onBackgroundRestore,\n  setBackgroundState,\n  waitForEvenAppBridge,\n  type EvenAppBridge,\n  type EvenHubEvent,\n} from '@evenrealities/even_hub_sdk'",
              "import {\n  waitForEvenAppBridge,\n  type EvenAppBridge,\n  type EvenHubEvent,\n} from '@evenrealities/even_hub_sdk'\nimport * as EvenSdk from '@evenrealities/even_hub_sdk'",
          )
          start = s.find('// Even Hub migrates the plugin between foreground and headless WebViews.')
          end = s.find("document.querySelector('#pair')", start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate G2 background-state block')
          block = r'''// Even Hub migrates the plugin between foreground and headless WebViews. SDK 0.0.15 does
          // not expose the documented background helpers in its public TypeScript surface, so use them
          // when a newer host injects them and fall back to the host snapshot hooks described by Even's
          // background-state contract. This keeps v0.5 buildable on 0.0.15 and forward-compatible.
          type BackgroundApi = {
            setBackgroundState?: (key: string, exporter: () => Record<string, unknown>) => void
            onBackgroundRestore?: (key: string, restorer: (saved: Record<string, unknown>) => void) => void
          }

          type HostStateWindow = Window & {
            __getStateSnapshot?: () => string
            __restoreState?: (snapshot: string) => void
          }

          const exportRuntimeState = (): PersistedState => ({
            pageIndex,
            data,
            etag,
            lastFetchAt,
            token: settings.token,
            clientId: settings.clientId,
          })

          function restoreRuntimeState(saved: Partial<PersistedState>) {
            pageIndex = normalizePage(saved.pageIndex ?? pageIndex)
            data = saved.data ?? data
            etag = saved.etag ?? etag
            lastFetchAt = saved.lastFetchAt ?? lastFetchAt
            settings = {
              ...settings,
              token: saved.token ?? settings.token,
              clientId: saved.clientId ?? settings.clientId,
            }
            persistAll()
            renderPhonePreview()
            void renderGlasses()
          }

          function registerBackgroundPersistence() {
            const backgroundApi = EvenSdk as unknown as BackgroundApi
            if (backgroundApi.setBackgroundState && backgroundApi.onBackgroundRestore) {
              backgroundApi.setBackgroundState(BACKGROUND_KEY, () => ({ ...exportRuntimeState() }))
              backgroundApi.onBackgroundRestore(BACKGROUND_KEY, (saved: Record<string, unknown>) => {
                restoreRuntimeState(saved as Partial<PersistedState>)
              })
              return
            }

            const host = window as HostStateWindow
            const previousGet = host.__getStateSnapshot?.bind(host)
            const previousRestore = host.__restoreState?.bind(host)

            host.__getStateSnapshot = () => {
              let rootState: Record<string, unknown> = {}
              if (previousGet) {
                try {
                  const previous = JSON.parse(previousGet()) as Record<string, unknown>
                  rootState = { ...previous }
                } catch {
                  // A previous hook did not return JSON. Health Week can still export its state.
                }
              }
              rootState[BACKGROUND_KEY] = exportRuntimeState()
              return JSON.stringify(rootState)
            }

            host.__restoreState = (snapshot: string) => {
              previousRestore?.(snapshot)
              try {
                const rootState = JSON.parse(snapshot) as Record<string, unknown>
                const saved = rootState[BACKGROUND_KEY]
                if (saved && typeof saved === 'object') {
                  restoreRuntimeState(saved as Partial<PersistedState>)
                }
              } catch (error) {
                console.warn('Could not restore Health Week G2 background state:', error)
              }
            }
          }

          registerBackgroundPersistence()

          '''
          main.write_text(s[:start] + block + s[end:])

          app_json = root / 'even-g2/app.json'
          manifest = json.loads(app_json.read_text())
          manifest['min_app_version'] = '2.2.10'
          manifest['min_sdk_version'] = '0.0.15'
          app_json.write_text(json.dumps(manifest, indent=2) + '\n')
          PY

          chmod +x "$PROJECT/gradlew"
          [[ -f "$PROJECT/desktop-pwa/run.sh" ]] && chmod +x "$PROJECT/desktop-pwa/run.sh"
          rm -f "$PROJECT/even-g2/package-lock.json"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Restore pinned Samsung Health Data SDK
        shell: bash
        env:
          PROJECT: ${{ steps.source.outputs.project }}
        run: |
          set -euo pipefail
          mkdir -p "$PROJECT/app/libs"
          curl --fail --location --retry 4 --retry-all-errors \
            -o "$PROJECT/app/libs/samsung-health-data-api-1.1.0.aar" \
            https://raw.githubusercontent.com/S108-Sleeper/Sleeper_APP/b15fa77b9f296bb1c9e50ee54f786d11b67fdd0b/App/core/samsung-health/libs/samsung-health-data-api-1.1.0.aar
          echo 'f5d3d83cf00b97d0bb1b1db4da076e861eb1c3e6e704d89a34e68909d2f38654  '"$PROJECT/app/libs/samsung-health-data-api-1.1.0.aar" \
            | sha256sum --check --strict -

      - name: Validate web/PWA source
        shell: bash
        env:
          PROJECT: ${{ steps.source.outputs.project }}
        run: |
          set -euo pipefail
          node --check "$PROJECT/app/src/main/assets/web/assets/app.js"
          node --check "$PROJECT/desktop-pwa/assets/app.js"

      - name: Build and package Even Realities G2 app
        shell: bash
        env:
          PROJECT: ${{ steps.source.outputs.project }}
        run: |
          set -euo pipefail
          cd "$PROJECT/even-g2"
          npm install --no-audit --no-fund
          npm run build
          npx evenhub pack app.json dist --sdk-ver 0.0.15 -o HealthWeek-G2-v0.5.0.ehpk
          test -s HealthWeek-G2-v0.5.0.ehpk

      - name: Unit tests, lint, phone APK and Wear OS APK
        shell: bash
        env:
          PROJECT: ${{ steps.source.outputs.project }}
        run: |
          set -euo pipefail
          cd "$PROJECT"
          ./gradlew \
            :app:testDebugUnitTest \
            :app:lintRelease \
            :app:assembleRelease \
            :wear:lintRelease \
            :wear:assembleRelease \
            --stacktrace \
            --no-daemon

      - name: Package complete unsigned release
        id: package
        shell: bash
        env:
          PROJECT: ${{ steps.source.outputs.project }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/HealthWeek-v0.5.0-build"
          rm -rf "$OUT"
          mkdir -p "$OUT/install" "$OUT/desktop" "$OUT/source" "$OUT/docs" "$OUT/validation"
          BT="$ANDROID_HOME/build-tools/36.0.0"

          PHONE="$(find "$PROJECT/app/build/outputs/apk/release" -maxdepth 1 -type f -name '*.apk' | head -1)"
          WATCH="$(find "$PROJECT/wear/build/outputs/apk/release" -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -f "$PHONE"
          test -f "$WATCH"

          "$BT/zipalign" -p -f 4 "$PHONE" "$OUT/install/HealthWeek-v0.5.0-unsigned.apk"
          "$BT/zipalign" -p -f 4 "$WATCH" "$OUT/install/HealthWeek-Wear-v0.5.0-unsigned.apk"
          "$BT/zipalign" -c -v 4 "$OUT/install/HealthWeek-v0.5.0-unsigned.apk" > "$OUT/validation/phone-zipalign.txt"
          "$BT/zipalign" -c -v 4 "$OUT/install/HealthWeek-Wear-v0.5.0-unsigned.apk" > "$OUT/validation/watch-zipalign.txt"
          "$BT/aapt" dump badging "$OUT/install/HealthWeek-v0.5.0-unsigned.apk" > "$OUT/validation/phone-aapt-badging.txt"
          "$BT/aapt" dump badging "$OUT/install/HealthWeek-Wear-v0.5.0-unsigned.apk" > "$OUT/validation/watch-aapt-badging.txt"
          unzip -t "$OUT/install/HealthWeek-v0.5.0-unsigned.apk" > "$OUT/validation/phone-zip-integrity.txt"
          unzip -t "$OUT/install/HealthWeek-Wear-v0.5.0-unsigned.apk" > "$OUT/validation/watch-zip-integrity.txt"

          cp "$PROJECT/even-g2/HealthWeek-G2-v0.5.0.ehpk" "$OUT/install/"
          unzip -t "$OUT/install/HealthWeek-G2-v0.5.0.ehpk" > "$OUT/validation/g2-zip-integrity.txt" || true

          (cd "$PROJECT/desktop-pwa" && zip -qr "$OUT/desktop/HealthWeek-Desktop-PWA-v0.5.0.zip" .)

          cp "$PROJECT/README.md" "$OUT/docs/README.md"
          cp -r "$PROJECT/docs/." "$OUT/docs/"
          cp "$PROJECT/app/build/reports/lint-results-release.html" "$OUT/validation/phone-lint.html" 2>/dev/null || true
          cp "$PROJECT/wear/build/reports/lint-results-release.html" "$OUT/validation/watch-lint.html" 2>/dev/null || true
          cp -r "$PROJECT/app/build/reports/tests/testDebugUnitTest" "$OUT/validation/phone-unit-tests" 2>/dev/null || true
          cp "$BT/zipalign" "$OUT/validation/zipalign"
          cp "$BT/lib/apksigner.jar" "$OUT/validation/apksigner.jar"

          rm -f "$PROJECT/app/libs/samsung-health-data-api-1.1.0.aar"
          rm -rf "$PROJECT/app/build" "$PROJECT/wear/build" "$PROJECT/.gradle" "$PROJECT/.kotlin" \
                 "$PROJECT/even-g2/node_modules" "$PROJECT/even-g2/dist"
          rm -f "$PROJECT/even-g2/HealthWeek-G2-v0.5.0.ehpk" "$PROJECT/signing.properties"
          find "$PROJECT" -type f \( -name '*.jks' -o -name '*.keystore' -o -name '*.p12' \) -delete
          (cd "$PROJECT" && zip -qr "$OUT/source/HealthWeek-v0.5.0-source.zip" .)

          cat > "$OUT/README-FIRST.md" <<'EOF'
          # Health Week v0.5.0

          This CI package contains the complete Health Week ecosystem:
          - Android Samsung Health companion / localhost G2 bridge
          - Wear OS companion
          - Even Realities G2 Even Hub app
          - Desktop PWA
          - full source and documentation
          - test/lint/integrity reports

          The Android APKs in this CI artifact are unsigned. They are signed outside GitHub with the existing private Health Week release key before user delivery.
          EOF

          find "$OUT" -type f -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS.txt"
          BUNDLE="$RUNNER_TEMP/HealthWeek-v0.5.0-unsigned-all-in-one.zip"
          (cd "$OUT" && zip -qr "$BUNDLE" .)
          unzip -t "$BUNDLE" >/dev/null
          sha256sum "$BUNDLE" > "$RUNNER_TEMP/HealthWeek-v0.5.0-unsigned-all-in-one.zip.sha256"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          echo "bundle=$BUNDLE" >> "$GITHUB_OUTPUT"

      - name: Upload complete build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HealthWeek-v0.5.0-unsigned-all-in-one
          path: |
            ${{ steps.package.outputs.out }}/**
            ${{ steps.package.outputs.bundle }}
            ${{ steps.package.outputs.bundle }}.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Publish browsable source branch
        continue-on-error: true
        shell: bash
        env:
          PROJECT: ${{ steps.source.outputs.project }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/source-publish"
          rm -rf "$WORK"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$WORK"
          cd "$WORK"
          git checkout --orphan healthweek-v05-source
          git rm -rf . >/dev/null 2>&1 || true
          cp -a "$PROJECT"/. .
          rm -rf app/build wear/build .gradle .kotlin even-g2/node_modules even-g2/dist
          rm -f app/libs/samsung-health-data-api-1.1.0.aar signing.properties even-g2/*.ehpk
          find . -type f \( -name '*.jks' -o -name '*.keystore' -o -name '*.p12' \) -delete
          cat > .gitignore <<'EOF'
          .gradle/
          .kotlin/
          **/build/
          local.properties
          app/libs/*.aar
          signing.properties
          *.jks
          *.keystore
          *.p12
          even-g2/node_modules/
          even-g2/dist/
          even-g2/*.ehpk
          EOF
          git add -A
          git -c user.name='healthweek-ci' -c user.email='actions@users.noreply.github.com' commit -m 'Health Week v0.5.0 source'
          git push --force origin HEAD:healthweek-v05-source
